<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Никита vs Хряки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0912;color:#fff;font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;overflow:hidden;touch-action:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px}
#top{width:min(100vw - 12px,calc((100vh - 190px)*1.7778));display:flex;align-items:center;gap:10px;font-size:clamp(7px,1.6vw,11px);min-height:22px}
#top .lv{color:#ffd23f;white-space:nowrap}
#top .bn{color:#ff6b9a;white-space:nowrap}
#hpbar{flex:1;height:10px;border:2px solid #fff;background:#2a1030;min-width:40px}
#hpfill{display:block;height:100%;width:100%;background:linear-gradient(#ff4d6d,#c9184a)}
#me{white-space:nowrap;font-size:clamp(8px,1.8vw,12px)}
#stage{position:relative;width:min(100vw - 12px,calc((100vh - 190px)*1.7778));aspect-ratio:16/9;border:3px solid #fff;box-shadow:0 0 0 3px #000,0 0 30px #ff2e8a66;background:#000}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(8,4,16,.82);padding:12px}
#ov.hide{display:none}
#ov h1{margin:0;font-size:clamp(14px,3.6vw,30px);line-height:1.3;color:#ffd23f;text-shadow:3px 3px 0 #c9184a}
#ov h2{margin:0;font-size:clamp(10px,2.4vw,18px);color:#ff6b9a;line-height:1.4}
#ov p{margin:0;font-size:clamp(7px,1.5vw,11px);line-height:1.7;color:#e8e0ff;max-width:92%}
#ov .q{color:#9ef0ff}
button{font:inherit;cursor:pointer;border:3px solid #fff;background:#c9184a;color:#fff;padding:10px 14px;font-size:clamp(8px,1.8vw,13px);box-shadow:4px 4px 0 #000}
button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
button.alt{background:#2b2d6e}
#dlg{width:min(100vw - 12px,calc((100vh - 190px)*1.7778));min-height:54px;border:3px solid #fff;background:#140a24;padding:8px 10px;font-size:clamp(8px,1.7vw,12px);line-height:1.6;display:flex;gap:8px;align-items:flex-start}
#who{white-space:nowrap}
#who.n{color:#6fe3ff}#who.b{color:#ff6b9a}
#btns{display:flex;gap:10px}
#hint{font-size:clamp(6px,1.2vw,9px);color:#8f86b8;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <div id="top"><span class="lv" id="lvl">УР. 1</span><span class="bn" id="bname">—</span><div id="hpbar"><i id="hpfill"></i></div><span id="me"></span></div>
  <div id="stage"><canvas id="c" width="320" height="180"></canvas><div id="ov"></div></div>
  <div id="dlg"><b id="who" class="n">НИКИТА:</b><span id="say">Ну чё, погнали.</span></div>
  <div id="btns"><button id="bomb" class="alt">💥 УЛЬТА [B]</button><button id="mute" class="alt">🔊</button></div>
  <div id="hint">СТРЕЛКИ/WASD — ходить · ПРОБЕЛ или мышь — стрелять · B — ульта · НА ТЕЛЕФОНЕ — води пальцем, стреляет само</div>
</div>
<script>
(()=>{
const W=320,H=180;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- ЗВУК ---------- */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,type='square',vol=.03,slide=0,delay=0){
  if(muted)return;const a=ac();if(!a)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d);
}
const sfx={
  shoot:()=>beep(880,.05,'square',.012,-420),
  hit:()=>beep(180,.04,'square',.02),
  hurt:()=>beep(320,.35,'sawtooth',.06,-260),
  bomb:()=>{beep(140,.7,'sawtooth',.08,-100);beep(60,.8,'square',.08,-20,.05)},
  pick:()=>{beep(660,.08,'square',.04);beep(990,.12,'square',.04,0,.08)},
  win:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.18,'square',.05,0,i*.12)),
  lose:()=>[400,330,260,180].forEach((f,i)=>beep(f,.25,'sawtooth',.06,-30,i*.18)),
  oink:()=>beep(220,.18,'sawtooth',.05,90)
};

/* ---------- ДАННЫЕ БОССОВ ---------- */
const GUNS=['ПМ «Дружок»','Обрез Дяди Вити','Калаш «Нервный»','Гранатомёт «Мама, не горюй»','Ядрён-батон 3000'];
const GUN_SHOTS=[1,2,2,3,3],GUN_CD=[.11,.11,.09,.09,.08];
const BOSSES=[
 {id:'boris',name:'ХРЯК БОРИС',sub:'Пахан с Рублёвки',hp:90,cy:50,hw:22,
  intro:'Ты хто такой, Никитос? Пошёл нахуй с моей фермы!',
  nstart:'Ща, хряк, всё будет быстро и больно.',
  atk:['Сосиской в лоб, сука!','Я тебя в колбасу превращу!','Ты за базар ответишь, мудила!','Хрю! Это тебе за аренду!'],
  hurt:['Ах ты ж гнида!','Ай, блядь, мой костюм!','Да я тебя в суд подам!'],
  p2:'А ну иди сюда, мудила!',p3:'Всё, пиздец тебе, пацанчик!',
  dead:'Бля... я ж вам платил...'},
 {id:'witch',name:'БАБА ХРЮНЯ',sub:'Ведьма с болота',hp:150,cy:52,hw:20,
  intro:'Ща зельем ебану, мальчик! Хрю-хрю-хрю!',
  nstart:'Бабка, тебе в пенсионный фонд, а не сюда!',
  atk:['Лети, пиздюк, лети!','Зелье дня — ХУЙ ТЕБЕ!','Хрю-хрю, мазила!','Я эту хуйню сто лет варила!'],
  hurt:['Ой, спина, блядь!','Ах ты ж паскудник!','Я щас порчу наведу!'],
  p2:'Ну всё, зелье второй свежести!',p3:'ГОРИ ВСЁ СИНИМ ПЛАМЕНЕМ, СУКА!',
  dead:'Ну и хуй с вами, я в отпуск...'},
 {id:'boar',name:'КАБАН ШВАРЦЕНХРЮГГЕР',sub:'Качок из подвала',hp:200,cy:52,hw:30,
  intro:'Я тя щас на жим положу, дрищ! Белок, блядь, белок!',
  nstart:'Здоровый, а мозгов — как у пельменя.',
  atk:['Я на курсе, мне похуй!','Хрюкни, если сильный!','Не пропускай ноги, сука!','Я в зале живу, чё ты мне сделаешь?'],
  hurt:['Бля, пресс пострадал!','Это мышца, а не жир, идиот!','Рука, блядь, рука!'],
  p2:'Ща разгон возьму, потом пиздец!',p3:'РЕЖИМ ЗВЕРЯ, НАХУЙ!',
  dead:'Я ж... на курсе был... а не доходил...'},
 {id:'bot',name:'БЕКОН-3000',sub:'Киборг-хряк из будущего',hp:260,cy:54,hw:22,
  intro:'ИДЁТ ЗАГРУЗКА ПИЗДЮЛЕЙ... 99%. ОБНАРУЖЕН НИКИТА.',
  nstart:'Железка, ща я тебя на запчасти разберу.',
  atk:['ЦЕЛЬ ЗАХВАЧЕНА, УЁБОК.','ПОДГОТОВКА УНИЖЕНИЯ.','БИП-БУП, ТЫ ПРОИГРАЛ.','ОШИБКА: У ТЕБЯ НЕТ ШАНСОВ.'],
  hurt:['ПОВРЕЖДЕНИЕ. ЗАЕБАЛО.','СИСТЕМА В ЖОПЕ.','АЙ, В ПРОЦЕССОР, СУКА.'],
  p2:'ВКЛЮЧАЮ ВТОРОЙ РЕЖИМ. ДВОЙНОЙ ПИЗДЕЦ.',p3:'ПЕРЕГРЕВ... ПОХУЙ, СТРЕЛЯЮ!',
  dead:'ОШИБКА 404: ХРЮ НЕ НАЙДЕНО...'},
 {id:'king',name:'КОРОЛЬ ХРЮНДЕЛЬ I',sub:'Главный хряк всея Руси',hp:600,cy:60,hw:26,
  intro:'Я, блядь, король! Склонись, смерд! Дань — три шашлыка!',
  nstart:'Корона у тебя ничего, жаль — ненадолго.',
  atk:['Склонись, холоп!','Казнить его нахуй!','Я тут власть, а ты — шашлык!','Стража! Ах да, я их распустил...'],
  hurt:['Да как ты смеешь, чернь!','Бунт, блядь! В моём замке!','Мою корону не трожь!'],
  p2:'Ты разбудил государя, ебанат!',p3:'ПУСТЬ ВСЁ ГОРИТ, Я КОРОЛЬ!',
  dead:'Ладно... ебись оно конём... корону забирай.'}
];
const N_SHOOT=['Получай, хряк, в упор!','Ну чё, бекон, допрыгался?!','Стою, стреляю, блядь, красиво!','Пиздец, какой ты живучий!','Мама, смотри, я босса мочу!','Ща я тебе шашлык устрою, нахуй!','Ёбаный в рот, опять мимо!','Патроны на последнюю зарплату, сука!','Хрюкай громче, всё равно не слышу!','За Родину, за пиво, за шашлык!','Давай, умирай уже, я на работу опаздываю!','Это тебе за все мои переработки!'];
const N_HURT=['Ай, блядь!','Сука, больно!','Нахуя в меня стрелять-то?!','Пиздец, у меня ипотека!','Это нечестно, ёпта!','Да чтоб тебя, хуйня свиная!'];
const N_HEAL=['О, шашлычок! Еду не выбирают.','Нихуя себе, здоровье подкинули!','Люблю, когда с боссов мясо падает.'];
const N_BOMB=['ПОЛУЧАЙ СКИДОЧНУЮ ЯДЕРКУ, ЕБТА!','БАБАХ, СУКА, ПО АКЦИИ!','ИЗ-ЗА УГЛА С ПРИВЕТОМ!'];
const N_WIN=['Хули, красавчик! Следующий!','Один хряк — один шашлык.','Вот и поговорили, блядь.'];

/* ---------- СОСТОЯНИЕ ---------- */
let state='title',lvl=0,P,boss,pb=[],eb=[],parts=[],drops=[],time=0,shake=0,flash=0,flashCol='#fff';
let firing=false,tx=160,ty=150,keys={},ovLock=0,sayT=0,sayPrio=0,nT=3,bT=6,stateT=0;
const stars=[];{let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<60;i++)stars.push([r()*W,r()*110,r()]);}
const blds=[];{let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let x=0;x<W;x+=24){blds.push([x,50+r()*60,18+r()*6,r()])}}

function say(who,text,dur=2.4,prio=1){
  if(sayT>0&&prio<sayPrio)return;
  sayT=dur;sayPrio=prio;
  const w=$('who');w.textContent=who==='n'?'НИКИТА:':(boss?boss.def.name+':':'');
  w.className=who;$('say').textContent=text;
}

/* ---------- ВВОД ---------- */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  keys[k]=true;ac();
  if(k==='b')useBomb();
  if((k==='enter'||k===' ')&&state!=='play'&&state!=='bossdead'&&performance.now()>ovLock){const b=document.querySelector('#ov button.main');if(b)b.click()}
  if(k==='m')toggleMute();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
const stage=$('stage');
function ptr(e){
  const r=cv.getBoundingClientRect();
  tx=(e.clientX-r.left)/r.width*W;ty=(e.clientY-r.top)/r.height*H-(e.pointerType==='touch'?16:0);
}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('#ov button'))return;ac();ptr(e);firing=true;stage.setPointerCapture&&stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||firing)ptr(e)});
const stopF=()=>{firing=false};
stage.addEventListener('pointerup',stopF);stage.addEventListener('pointercancel',stopF);
function toggleMute(){muted=!muted;$('mute').textContent=muted?'🔇':'🔊'}
$('mute').onclick=toggleMute;
$('bomb').onclick=()=>{ac();useBomb()};

/* ---------- ОВЕРЛЕИ ---------- */
const ov=$('ov');
function showOv(html){ov.innerHTML=html;ov.classList.remove('hide');ovLock=performance.now()+700}
function hideOv(){ov.classList.add('hide');ov.innerHTML=''}
function title(){
  state='title';
  showOv(`<h1>НИКИТА<br>против ХРЯКОВ</h1>
   <p>Пять боссов. Пять стволов. Дохуя мата.<br>Все хряки выдуманные, все обиды настоящие.</p>
   <p class="q">Двигайся, стреляй, уворачивайся от сосисок.<br>B — ультанка (1 на уровень).</p>
   <button class="main" id="go">В БОЙ</button>`);
  $('go').onclick=()=>{ac();intro(0)};
}
function intro(i){
  lvl=i;state='intro';const d=BOSSES[i];
  showOv(`<h2>УРОВЕНЬ ${i+1} / ${BOSSES.length}</h2>
   <h1>${d.name}</h1><p>${d.sub}</p>
   <p class="q">«${d.intro}»</p>
   <p>Ствол: ${GUNS[i]}</p>
   <button class="main" id="go">ЕБАШИТЬ</button>`);
  $('go').onclick=()=>{ac();startLevel(i)};
}
function startLevel(i){
  hideOv();lvl=i;const d=BOSSES[i];
  P={x:160,y:150,hp:5,inv:0,bombs:1,cd:0,muzzle:0};tx=160;ty=150;
  pb=[];eb=[];parts=[];drops=[];shake=0;flash=0;
  boss={def:d,x:160,y:-70,cy:d.cy,hp:d.hp,max:d.hp,t:0,ph:0,cd:1.2,cd2:2,sp:0,ang:0,cyc:0,rot:0,fl:0,mouth:0,
        state:'enter',st:1.4,mode:'idle',dashT:3,mt:0,dir:1,tx:160,p2:false,p3:false,d1:false,d2:false,dir2:1,dieT:0};
  state='play';sayT=0;sayPrio=0;nT=3;bT=7;
  $('lvl').textContent='УР. '+(i+1);$('bname').textContent=d.name;
  say('b',d.intro,2.2,3);setTimeout(()=>{if(state==='play')say('n',d.nstart,2.6,3)},2300);
  hud();sfx.oink();
}
function hud(){
  $('hpfill').style.width=clamp(boss.hp/boss.max*100,0,100)+'%';
  $('me').textContent='❤'.repeat(Math.max(0,P.hp))+'·'.repeat(5-Math.max(0,P.hp))+'  💥'+P.bombs;
}

/* ---------- ПУЛИ ---------- */
function ebul(x,y,vx,vy,c='#8a3b1f'){eb.push({x,y,vx,vy,c})}
function aim(b,spd,off=0){const a=Math.atan2(P.y-(b.y+10),P.x-b.x)+off;ebul(b.x,b.y+12,Math.cos(a)*spd,Math.sin(a)*spd)}
function ring(b,n,spd,off){for(let i=0;i<n;i++){const a=off+i/n*Math.PI*2;ebul(b.x,b.y+12,Math.cos(a)*spd,Math.sin(a)*spd)}}
function burst(x,y,n,cols,sp=70,life=.6){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*rnd(.5,1),max:life,c:pick(cols),s:Math.random()<.3?2:1})}}

function useBomb(){
  if(state!=='play'||!P||P.bombs<=0||boss.state==='enter')return;
  P.bombs--;P.inv=Math.max(P.inv,1);flash=.35;flashCol='#fff';shake=8;sfx.bomb();
  eb.forEach(b=>burst(b.x,b.y,2,['#ffd23f','#ff6b9a','#fff'],40));eb=[];
  boss.hp-=15;boss.fl=.2;say('n',pick(N_BOMB),2.6,5);hud();
}

/* ---------- ИИ БОССОВ ---------- */
function bossAI(b,dt){
  const d=b.def,r=b.hp/b.max,ph=r<.25?3:r<.5?2:1;
  if(b.state==='enter'){b.y+=(b.cy-b.y)*Math.min(1,dt*3);b.st-=dt;if(b.st<=0){b.state='fight';b.y=b.cy}return}
  b.t+=dt;b.mouth=Math.max(0,b.mouth-dt);b.fl=Math.max(0,b.fl-dt);
  if(ph>=2&&!b.p2){b.p2=true;say('b',d.p2,2.6,4);shake=6;sfx.oink();burst(b.x,b.y,16,['#fff','#ff6b9a'],90)}
  if(ph>=3&&!b.p3){b.p3=true;say('b',d.p3,2.6,4);shake=8;sfx.oink();burst(b.x,b.y,24,['#fff','#ffd23f'],110)}
  if(!b.d1&&r<.66){b.d1=true;drops.push({x:b.x,y:b.y+30,vy:35})}
  if(!b.d2&&r<.33){b.d2=true;drops.push({x:b.x,y:b.y+30,vy:35})}
  b.cd-=dt;b.cd2-=dt;
  bT-=dt;if(bT<=0&&sayT<=0){bT=rnd(6,9);say('b',pick(d.atk),2.2,2)}
  switch(d.id){
  case'boris':
    b.ph+=dt*(.9+.25*ph);b.x=W/2+Math.sin(b.ph)*95;
    if(b.cd<=0){b.cd=[0,1.1,.95,.8][ph];b.mouth=.25;
      if(ph===1)aim(b,80);else{aim(b,85,-.28);aim(b,85,0);aim(b,85,.28)}}
    if(ph===3&&b.cd2<=0){b.cd2=.38;ebul(rnd(10,310),-4,0,90)}
    break;
  case'witch':
    b.ph+=dt*(1+.2*ph);b.x=W/2+Math.sin(b.ph)*105;
    if(b.cd<=0){b.cd=[0,1.8,1.55,1.35][ph];b.mouth=.3;b.rot+=.37;ring(b,[0,10,12,16][ph],55,b.rot)}
    if(b.cd2<=0){b.cd2=ph===1?2.4:ph===2?1.3:.9;aim(b,90);if(ph>=2){aim(b,90,.3);aim(b,90,-.3)}}
    break;
  case'boar':
    if(b.mode==='idle'){
      b.x+=(b.tx-b.x)*Math.min(1,dt*1.5);
      if(b.cd<=0){b.cd=[0,1.2,1,.85][ph];b.mouth=.25;aim(b,80,-.2);aim(b,80,0);aim(b,80,.2)}
      b.dashT-=dt;if(b.dashT<=0){b.mode='tele';b.mt=.8;b.dir=b.x<W/2?1:-1}
    }else if(b.mode==='tele'){
      b.mt-=dt;shake=Math.max(shake,1.5);if(b.mt<=0){b.mode='dash';b.sp=0}
    }else{
      b.x+=b.dir*(ph>=2?300:240)*dt;b.sp-=dt;
      if(b.sp<=0){b.sp=.09;ebul(b.x+rnd(-12,12),b.y+28,rnd(-12,12),70)}
      if(b.x<30||b.x>W-30){b.x=clamp(b.x,30,W-30);b.mode='idle';b.dashT=rnd(3,4.5)-ph*.5;b.tx=W/2+rnd(-70,70)}
    }
    break;
  case'bot':
    b.ph+=dt*.8;b.x=W/2+Math.sin(b.ph)*80;b.cyc+=dt;
    if((b.cyc%4)<2.6){b.sp-=dt;if(b.sp<=0){b.sp=ph===1?.15:.11;
      const a=Math.PI/2+Math.sin(b.cyc*3)*1.15;ebul(b.x,b.y+12,Math.cos(a)*62,Math.sin(a)*62,'#c33');
      if(ph>=2){const a2=Math.PI/2-Math.sin(b.cyc*3)*1.15;ebul(b.x,b.y+12,Math.cos(a2)*62,Math.sin(a2)*62,'#c33')}
      b.mouth=.1}}
    if(b.cd<=0){b.cd=ph===3?1.1:1.5;aim(b,95);if(ph===3){aim(b,95,.25);aim(b,95,-.25)}}
    break;
  case'king':
    b.ph+=dt*(.7+.2*ph);b.x=W/2+Math.sin(b.ph)*110;b.cyc+=dt;
    if(b.cd<=0){b.cd=[0,2.6,2.2,1.9][ph];b.mouth=.3;b.rot+=.3;ring(b,[0,12,14,16][ph],52,b.rot)}
    if(b.cd2<=0){b.cd2=1.3;aim(b,88,-.25);aim(b,88,0);aim(b,88,.25)}
    if(ph>=2&&(b.cyc%4)<2){b.sp-=dt;if(b.sp<=0){b.sp=.16;const a=Math.PI/2+Math.sin(b.cyc*3.5)*1.2;ebul(b.x,b.y+12,Math.cos(a)*60,Math.sin(a)*60,'#fc0')}}
    if(ph===3){b.dir2-=dt;if(b.dir2<=0){b.dir2=.3;ebul(rnd(10,310),-4,0,85,'#c33')}}
    break;
  }
}

/* ---------- ОБНОВЛЕНИЕ ---------- */
function update(dt){
  time+=dt;sayT-=dt;shake=Math.max(0,shake-dt*20);flash=Math.max(0,flash-dt);
  if(state==='play'||state==='bossdead'){
    // движение
    let dx=(keys['arrowright']||keys['d']||keys['в']?1:0)-(keys['arrowleft']||keys['a']||keys['ф']?1:0);
    let dy=(keys['arrowdown']||keys['s']||keys['ы']?1:0)-(keys['arrowup']||keys['w']||keys['ц']?1:0);
    if(dx||dy){const l=Math.hypot(dx,dy);P.x+=dx/l*110*dt;P.y+=dy/l*110*dt;tx=P.x;ty=P.y}
    else{const ddx=tx-P.x,ddy=ty-P.y,dist=Math.hypot(ddx,ddy);if(dist>1){const m=Math.min(dist,200*dt);P.x+=ddx/dist*m;P.y+=ddy/dist*m}}
    P.x=clamp(P.x,8,W-8);P.y=clamp(P.y,100,168);
    P.inv=Math.max(0,P.inv-dt);P.muzzle=Math.max(0,P.muzzle-dt);
    // стрельба
    P.cd-=dt;const fire=firing||keys[' '];
    if(state==='play'&&fire&&P.cd<=0&&boss.state!=='enter'){
      P.cd=GUN_CD[lvl];P.muzzle=.05;const n=GUN_SHOTS[lvl];
      for(let i=0;i<n;i++){const o=(i-(n-1)/2)*5;pb.push({x:P.x+o,y:P.y-12,vx:o*2.2,vy:-270})}
      sfx.shoot();
      nT-=.11;
    }
    if(fire&&state==='play'){nT-=dt;if(nT<=0&&boss.state!=='enter'){nT=rnd(4,6);say('n',pick(N_SHOOT),2.4,1)}}
  }
  if(state==='play'){
    bossAI(boss,dt);
    // пули игрока
    for(const b of pb){b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(boss.state!=='enter'&&Math.abs(b.x-boss.x)<boss.def.hw&&b.y>boss.y-22&&b.y<boss.y+32){
        b.dead=true;boss.hp--;boss.fl=.06;burst(b.x,b.y,2,['#fff','#ffd23f','#ff6b9a'],50,.3);
        if(Math.random()<.25)sfx.hit();
        if(Math.random()<.015)say('b',pick(boss.def.hurt),1.8,2);
      }}
    pb=pb.filter(b=>!b.dead&&b.y>-8&&b.x>-8&&b.x<W+8);
    hud();
    if(boss.hp<=0){boss.hp=0;hud();state='bossdead';stateT=2.4;eb.forEach(b=>burst(b.x,b.y,2,['#ffd23f','#fff'],40));eb=[];
      say('b',boss.def.dead,3,5);sfx.oink();shake=10;flash=.3;flashCol='#fff'}
  }
  // пули врагов
  for(const b of eb){b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(state==='play'&&P.inv<=0&&Math.abs(b.x-P.x)<4&&Math.abs(b.y-(P.y+1))<5){
      b.dead=true;hurt();
    }}
  eb=eb.filter(b=>!b.dead&&b.x>-12&&b.x<W+12&&b.y>-12&&b.y<H+12);
  // дропы
  for(const d of drops){d.y+=d.vy*dt;
    if(state==='play'&&Math.abs(d.x-P.x)<10&&Math.abs(d.y-P.y)<12){d.dead=true;P.hp=Math.min(5,P.hp+1);sfx.pick();say('n',pick(N_HEAL),2.4,4);burst(d.x,d.y,10,['#ffd23f','#ff9a3d'],60);hud()}}
  drops=drops.filter(d=>!d.dead&&d.y<H+10);
  // частицы
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  // смерть босса
  if(state==='bossdead'){
    stateT-=dt;boss.fl=.05;
    if(Math.random()<.5)burst(boss.x+rnd(-24,24),boss.y+rnd(-20,30),6,['#fff','#ffd23f','#ff6b9a','#ff9a3d'],90,.7);
    if(Math.random()<.2)beep(rnd(80,200),.2,'sawtooth',.05,-40);
    if(stateT<=0)levelWin();
  }
  if(state==='dying'){stateT-=dt;if(stateT<=0)gameOver()}
}
function hurt(){
  P.hp--;P.inv=1.6;shake=6;flash=.2;flashCol='#ff2e4d';sfx.hurt();
  burst(P.x,P.y,12,['#ff2e4d','#fff','#c33'],80);say('n',pick(N_HURT),2,4);hud();
  if(P.hp<=0){state='dying';stateT=1;eb=[];sfx.lose();burst(P.x,P.y,30,['#ff2e4d','#fff','#ffd23f'],110,.9)}
}
function levelWin(){
  state='levelwin';sfx.win();say('n',pick(N_WIN),3,5);
  if(lvl>=BOSSES.length-1){
    showOv(`<h1>ПОБЕДА!</h1><h2>Никита — легенда</h2>
      <p class="q">Все пять хряков лежат. Шашлык за счёт заведения.<br>Король отдал корону. Соседи хотят автограф.</p>
      <p>Хряки не пострадали (они ненастоящие).</p>
      <button class="main" id="go">ЗАНОВО</button>`);
    $('go').onclick=()=>intro(0);
  }else{
    const nx=BOSSES[lvl+1];
    showOv(`<h1>БОСС ПОВЕРЖЕН!</h1><h2>${BOSSES[lvl].name} в минусе</h2>
      <p class="q">«${BOSSES[lvl].dead}»</p>
      <p>Дальше: ${nx.name}<br>Новый ствол: ${GUNS[lvl+1]}</p>
      <button class="main" id="go">ДАЛЬШЕ</button>`);
    $('go').onclick=()=>intro(lvl+1);
  }
}
function gameOver(){
  state='over';
  showOv(`<h1>СЛИЛСЯ</h1><h2>${BOSSES[lvl].name} победил</h2>
    <p class="q">Передайте маме, что я не пил...</p>
    <button class="main" id="go">ЕЩЁ РАЗ, БЛЯДЬ</button>
    <button id="menu" class="alt">В МЕНЮ</button>`);
  $('go').onclick=()=>startLevel(lvl);$('menu').onclick=title;
}

  // виньетка
  R(0,0,W,1,'#0006');R(0,H-1,W,1,'#0006');
}

function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state!=='title'&&state!=='intro')update(dt);else{time+=dt}
  if(state==='title'||state==='intro'){bg(state==='intro'?lvl:0);}
  else render();
  requestAnimationFrame(loop);
}
