<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>English Blocks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;700;800;900&family=Onest:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: "baseplate" app — dotted grid ground, sentence parts are colour-coded studded blocks; top bar + view, bottom tab bar on phones */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface2:#F5F7FC; --ink:#151A30; --muted:#5C6584; --line:#DBE0EE; --grid:#CFD6E8;
  --c-s:#4D5BFF; --c-v:#FF5A47; --c-o:#0FA98F; --c-p:#F29D0C; --c-t:#9A55F5; --c-x:#EE3E93; --c-q:#1694E8; --c-a:#5E6E8C; --c-n:#2B2F45; --c-l:#0E9FC2; --c-m:#7E8F1F; --c-k:#D946EF;
  --ok:#12A660; --bad:#E5362C; --okbg:#E3F6EC; --badbg:#FDE8E6;
  --shadow:0 1px 2px rgba(21,26,48,.06),0 8px 24px rgba(21,26,48,.07);
  --f-display:'Geologica','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-en:'Instrument Serif',Georgia,'Times New Roman',serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1020; --surface:#161A2D; --surface2:#1D2238; --ink:#EEF1FB; --muted:#9AA3C6; --line:#293050; --grid:#20263F;
  --c-a:#7D8CAB; --c-n:#4A5070; --okbg:#10291E; --badbg:#2E1416; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1020; --surface:#161A2D; --surface2:#1D2238; --ink:#EEF1FB; --muted:#9AA3C6; --line:#293050; --grid:#20263F;
  --c-a:#7D8CAB; --c-n:#4A5070; --okbg:#10291E; --badbg:#2E1416; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(var(--grid) 1.6px,transparent 1.8px);background-size:22px 22px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--c-s);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.en{font-family:var(--f-en);font-weight:400}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:900;font-size:18px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand svg{width:30px;height:30px}
.nav{display:flex;gap:4px;flex:1;min-width:0}
.nav a{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;transition:background .2s,color .2s}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--surface)}
.stats{display:flex;gap:8px;align-items:center}
.stat{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat svg{width:16px;height:16px}
.stat.bump{animation:bump .5s cubic-bezier(.3,1.7,.5,1)}

main{max-width:1200px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{animation:viewIn .45s cubic-bezier(.2,1,.3,1)}

/* tab bar (phones) */
.tabbar{display:none}

/* blocks */
.blk{--r:var(--c-s);position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 14px 10px;margin-top:6px;border-radius:10px;background:var(--r);color:#fff;font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.06);white-space:nowrap}
.blk::before{content:"";position:absolute;top:-5px;left:10px;width:12px;height:6px;border-radius:6px 6px 0 0;background:var(--r);box-shadow:18px 0 0 var(--r)}
.blk small{font-family:var(--f-mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.r-s{--r:var(--c-s)}.r-v{--r:var(--c-v)}.r-o{--r:var(--c-o)}.r-p{--r:var(--c-p)}.r-t{--r:var(--c-t)}.r-x{--r:var(--c-x)}.r-q{--r:var(--c-q)}.r-a{--r:var(--c-a)}.r-n{--r:var(--c-n)}
.blk.plus{background:none;color:var(--muted);box-shadow:none;padding:9px 2px;font-weight:700}
.blk.plus::before{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--ink);color:var(--surface);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:transform .15s,filter .15s;text-decoration:none}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.c{background:var(--c-s);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px}
.ico{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);transition:transform .15s,background .15s;flex:none}
.ico:hover{transform:scale(1.08);background:var(--surface)}
.ico svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:3px;background:var(--r,var(--muted))}
.chip b{font-family:var(--f-mono);font-size:11px;opacity:.7}
.tip{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:var(--surface2);border:1px dashed var(--line);font-size:15px}
.tip svg{width:22px;height:22px;flex:none;color:var(--c-p)}
.say{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:left}
.say svg{width:16px;height:16px;color:var(--c-s);flex:none}
.say:hover .en{text-decoration:underline;text-decoration-color:var(--c-s);text-underline-offset:4px}
.sec-h{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;max-width:760px}
.sec-h h1{font-size:clamp(30px,4.4vw,48px);font-weight:900;line-height:1.02}
.sec-h p{color:var(--muted);font-size:17px;max-width:62ch}

/* START */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center;margin-bottom:34px}
.hero h1{font-size:clamp(38px,6vw,74px);font-weight:900;line-height:.98;letter-spacing:-.025em}
.hero h1 em{font-family:var(--f-en);font-weight:400;font-style:italic;letter-spacing:0;color:var(--c-v)}
.hero-copy{display:flex;flex-direction:column;gap:18px}
.hero-copy>p{font-size:18px;color:var(--muted);max-width:44ch}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.plate{position:relative;padding:28px 22px 22px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:18px;overflow:hidden;cursor:pointer}
.plate .lane{display:flex;flex-wrap:wrap;gap:10px 8px;align-items:flex-end;min-height:76px}
.plate .blk{font-size:clamp(16px,2.1vw,22px);padding:12px 16px 13px}
.plate .blk.drop{animation:drop .6s cubic-bezier(.3,1.5,.5,1) both}
.plate .ru{font-size:16px;color:var(--muted);min-height:1.5em;transition:opacity .4s}
.plate .meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--r)}
.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:28px}
.step{position:relative;padding:20px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);transition:transform .2s,box-shadow .2s}
.step:hover{transform:translateY(-4px)}
.step .num{font-family:var(--f-display);font-weight:900;font-size:42px;line-height:1;color:var(--r)}
.step h3{font-size:20px}
.step p{color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--r,var(--c-s));border-radius:99px;transition:width 1s cubic-bezier(.2,1,.3,1)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}

/* BUILD */
.build{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
.lessons{display:flex;flex-direction:column;gap:6px;position:sticky;top:84px}
.lessons button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid transparent;background:none;transition:background .15s}
.lessons button:hover{background:var(--surface)}
.lessons button.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.lessons .n{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);font-family:var(--f-display);font-weight:800;flex:none}
.lessons button.done .n{background:var(--ok);color:#fff;border-color:var(--ok)}
.lessons button.on .n{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lessons strong{display:block;font-size:14px;line-height:1.25}
.lessons small{color:var(--muted);font-size:12px}
.lesson{display:flex;flex-direction:column;gap:20px}
.lesson-head{padding:26px;display:flex;flex-direction:column;gap:16px}
.lesson-head h2{font-size:clamp(24px,3vw,34px);font-weight:900}
.lesson-head .body{font-size:17px;max-width:66ch}
.lesson-head .body b{font-weight:700}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:16px;border-radius:14px;background:var(--surface2)}
.exlist{display:flex;flex-direction:column;gap:10px}
.exl{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.exl .en{font-size:23px;line-height:1.2}
.exl .ru{color:var(--muted);font-size:14px}
.auxt{width:100%;border-collapse:collapse;font-size:14px}
.auxt th,.auxt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.auxt th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tbl{overflow-x:auto}
.ex{padding:22px;display:flex;flex-direction:column;gap:14px;transition:border-color .3s,background .3s}
.ex.ok{border-color:var(--ok);background:linear-gradient(var(--okbg),var(--okbg)) padding-box}
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ex-ru{font-size:18px;font-weight:600}
.ex-ru span{color:var(--muted);font-weight:500;font-size:14px;display:block}
.slot{min-height:66px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:12px;border-radius:14px;border:2px dashed var(--line);background:var(--surface2);transition:border-color .2s}
.slot:empty::after{content:"Нажимай на кубики снизу, чтобы собрать предложение";color:var(--muted);font-size:14px;align-self:center}
.pool{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;min-height:52px}
.pool .blk,.slot .blk{border:0;cursor:pointer;transition:transform .15s,filter .15s}
.pool .blk:hover,.slot .blk:hover{transform:translateY(-3px);filter:brightness(1.08)}
.blk.pop{animation:pop .3s cubic-bezier(.3,1.7,.5,1)}
.blk.wrong{outline:3px solid var(--bad);outline-offset:2px;animation:shake .4s}
.ex-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ex-msg{font-weight:600;font-size:14px}
.ex-msg.good{color:var(--ok)}.ex-msg.badm{color:var(--bad)}
.shake{animation:shake .45s}

/* TENSES */
.matrix{display:grid;grid-template-columns:110px repeat(4,minmax(0,1fr));gap:8px;margin-bottom:18px}
.mh{padding:10px 12px;border-radius:14px;display:flex;flex-direction:column;gap:3px}
.mh b{font-family:var(--f-display);font-size:16px}
.mh span{font-size:12px;color:var(--muted)}
.mh code{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--r)}
.mrow{display:flex;align-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;padding:0 6px}
.cell{position:relative;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px;min-height:96px;transition:transform .18s,box-shadow .18s,border-color .18s}
.cell::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--r)}
.cell:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cell.on{border-color:var(--r);box-shadow:0 0 0 2px var(--r),var(--shadow)}
.cell b{font-family:var(--f-display);font-size:15px;padding-right:38px}
.cell .en{font-size:17px;color:var(--muted);line-height:1.2}
.cell .star{position:absolute;top:10px;right:10px;font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:var(--c-p);color:#fff}
.cell.hl{animation:glow 1s ease 2}
.detect{padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-bottom:22px}
.detect .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.detect .grp>span{font-weight:700;margin-right:4px}
.tdetail{padding:26px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;scroll-margin-top:90px}
.tdetail h2{font-size:clamp(28px,3.4vw,40px);font-weight:900}
.tdetail .runame{color:var(--muted);font-weight:600}
.tcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.idea{font-size:18px;font-weight:600;line-height:1.4}
.tl{width:100%;height:auto;display:block;background:var(--surface2);border-radius:14px}
.tl text{font-family:var(--f-mono);font-size:12px;fill:var(--muted)}
.tl .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}
.tl .popin{transform-box:fill-box;transform-origin:center;animation:popin .5s cubic-bezier(.3,1.7,.5,1) both}
.forms{display:grid;gap:8px}
.form{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.form .sg{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;font-family:var(--f-display);font-weight:900;font-size:18px;color:#fff;background:var(--r)}
.form code{font-family:var(--f-mono);font-size:14px;font-weight:500;overflow-wrap:anywhere}
.sigs{display:flex;flex-wrap:wrap;gap:6px}
.sigs span{font-family:var(--f-mono);font-size:12px;padding:4px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.quiz{display:flex;flex-direction:column;gap:14px}
.qi{display:flex;flex-direction:column;gap:8px}
.qi .qs{font-size:20px}
.qi .qs .en{font-size:22px}
.qopts{display:flex;flex-wrap:wrap;gap:8px}
.qopt{padding:9px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;transition:all .15s}
.qopt:hover:not(:disabled){border-color:var(--ink);transform:translateY(-2px)}
.qopt.right{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.qopt.no{background:var(--badbg);border-color:var(--bad);color:var(--bad);animation:shake .4s}
.qopt:disabled{cursor:default}
.why{font-size:14px;color:var(--muted)}
.why.good{color:var(--ok)}
.irr{padding:20px;margin-top:22px}
.irr summary{cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:20px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.irr summary::-webkit-details-marker{display:none}
.irr summary span{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted)}
.irrg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:16px}
.irrg button{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);text-align:left;font-size:14px;transition:transform .15s}
.irrg button:hover{transform:translateY(-2px)}
.irrg em{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--muted);display:block}

/* WORDS */
.wtools{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.search{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search input{flex:1;min-width:200px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.wotd{padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;margin-bottom:18px;position:relative;overflow:hidden}
.wotd .big{font-family:var(--f-en);font-size:clamp(40px,6vw,64px);line-height:1}
.wotd::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:30px;background:var(--r);opacity:.12;transform:rotate(18deg)}
.wgrid{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.w{position:relative;text-align:left;padding:14px 40px 14px 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:3px;transition:transform .18s,box-shadow .18s;min-width:0}
.w::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--r)}
.w:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.w .wd{font-family:var(--f-en);font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.w .tr{color:var(--muted);font-size:14px}
.w .more{display:none;flex-direction:column;gap:10px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}
.w.open{grid-column:span 2}
.w.open .more{display:flex;animation:viewIn .3s ease}
.w .exs{font-family:var(--f-en);font-size:20px;line-height:1.3}
.w .acts{display:flex;gap:6px;flex-wrap:wrap}
.w .kn{position:absolute;top:12px;right:34px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--ok);color:#fff}
.w .kn svg{width:14px;height:14px}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* TRAIN */
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.mode{text-align:left;padding:18px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent;transition:transform .18s,border-color .18s}
.mode:hover{transform:translateY(-3px)}
.mode.on{border-color:var(--r)}
.mode .mi{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--r);color:#fff}
.mode .mi svg{width:22px;height:22px}
.mode b{font-family:var(--f-display);font-size:17px}
.mode span{font-size:13px;color:var(--muted)}
.trainbox{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.arena{padding:24px;display:flex;flex-direction:column;gap:18px;min-height:420px}
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1}
.prog span{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.flip{perspective:1200px;min-height:250px;cursor:pointer}
.flip-in{position:relative;min-height:250px;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;background:var(--surface2);border:1px solid var(--line)}
.face.back{transform:rotateY(180deg);background:var(--surface);border:2px solid var(--r,var(--c-s))}
.face .lbl{position:absolute;top:14px;left:16px}
.face .big{font-family:var(--f-en);font-size:clamp(34px,5vw,52px);line-height:1.05}
.face .ruw{font-size:clamp(22px,3vw,30px);font-weight:700;font-family:var(--f-display)}
.face .exs{font-family:var(--f-en);font-size:19px;color:var(--muted);max-width:40ch}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grade button{padding:13px 10px;border-radius:12px;border:0;font-weight:700;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);transition:transform .15s}
.grade button:hover{transform:translateY(-2px)}
.g0{background:var(--bad)}.g1{background:var(--c-p)}.g2{background:var(--ok)}
.mcq{display:flex;flex-direction:column;gap:16px}
.mcq .prompt{font-size:clamp(22px,3vw,28px);line-height:1.3}
.mcq .prompt .en{font-size:1.1em}
.gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--c-s);text-align:center;color:var(--c-s);font-family:var(--f-en)}
.mopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mopts .qopt{padding:14px;font-size:17px;text-align:left}
.mopts .qopt .en{font-size:21px}
.side{padding:20px;display:flex;flex-direction:column;gap:14px}
.boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end;height:150px}
.boxes div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.boxes i{width:100%;border-radius:8px 8px 4px 4px;background:var(--r);min-height:4px;transition:height .8s cubic-bezier(.2,1,.3,1)}
.boxes b{font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums}
.boxes span{font-size:10px;color:var(--muted);text-align:center;line-height:1.1}
.done{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;min-height:360px}
.done .score{font-family:var(--f-display);font-size:64px;font-weight:900;line-height:1}

/* SCIENCE */
.sci{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fact{padding:22px;display:flex;flex-direction:column;gap:10px}
.fact .num{font-family:var(--f-display);font-weight:900;font-size:clamp(36px,5vw,54px);line-height:1;color:var(--r)}
.fact h3{font-size:19px}
.fact p{color:var(--muted);font-size:15px}
.fact cite{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:auto}
.how{padding:24px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.how ol{margin:0;padding-left:22px;display:grid;gap:8px}

/* youth layer: aurora, ticker, stickers, chat */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.34;animation:drift 24s ease-in-out infinite}
.aurora i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-10vmax;background:var(--c-t)}
.aurora i:nth-child(2){width:40vmax;height:40vmax;right:-10vmax;top:18vh;background:var(--c-x);animation-delay:-8s}
.aurora i:nth-child(3){width:38vmax;height:38vmax;left:24vw;bottom:-16vmax;background:var(--c-l);animation-delay:-15s}
@keyframes drift{50%{transform:translate(6vmax,4vmax) scale(1.15)}}
.hero{position:relative}
.hero>*:not(.stickers){position:relative;z-index:1}
.stickers{position:absolute;inset:0;pointer-events:none;z-index:0}
.stickers svg{position:absolute;animation:floaty 6s ease-in-out infinite}
.stickers .a{right:5%;top:-14px;width:58px;color:var(--c-p)}
.stickers .b{left:44%;bottom:-8px;width:46px;color:var(--c-x);animation-delay:-2s}
.stickers .c{right:46%;top:-6px;width:34px;color:var(--c-o);animation-delay:-4s}
@keyframes floaty{50%{transform:translateY(-14px) rotate(14deg)}}
.hero h1 em{background:linear-gradient(90deg,var(--c-v),var(--c-x),var(--c-t),var(--c-q),var(--c-v));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.ticker{overflow:hidden;margin:0 0 26px;transform:rotate(-1deg);background:var(--ink);color:var(--surface);border-radius:14px;padding:11px 0;box-shadow:var(--shadow)}
.ticker-in{display:flex;width:max-content;animation:marq 46s linear infinite;font-family:var(--f-display);font-weight:800;font-size:18px;white-space:nowrap}
.ticker:hover .ticker-in{animation-play-state:paused}
.ticker-in span{display:inline-flex;align-items:center;gap:26px;padding-right:26px}
.ticker-in span::after{content:"";width:10px;height:10px;border-radius:3px;background:var(--c);transform:rotate(45deg)}
@keyframes marq{to{transform:translateX(-50%)}}
.btn{transition:transform .18s cubic-bezier(.3,1.8,.5,1),filter .15s}
.btn:hover{transform:translateY(-3px) rotate(-1deg) scale(1.03)}
.chip{transition:transform .18s cubic-bezier(.3,1.8,.5,1),all .15s}
.chip:hover{transform:translateY(-2px)}
.banners{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
.banners .gbanner{margin:0}
.banners .gbanner:hover{transform:translateY(-3px) rotate(-.4deg)}
.gbanner{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.wgrid .w{animation:cardIn .5s cubic-bezier(.2,1.3,.4,1) backwards;animation-delay:calc(var(--i,0)*22ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.96)}}
.exru{font-size:13px;color:var(--muted);margin:2px 0 0;font-family:var(--f-body)}
.chatx{padding:10px 12px;border-radius:14px 14px 14px 4px;background:linear-gradient(135deg,color-mix(in srgb,var(--c-s) 12%,var(--surface)),var(--surface2));border:1px solid var(--line)}
.chatx .exs{font-size:18px}
.lbl2{display:block;font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c-s);margin-bottom:3px}
.gate{padding:30px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;border:2px dashed var(--bad)}
.gate h3{font-size:26px}
.gate p{color:var(--muted);max-width:60ch}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:22px}
.rg{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--r);display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.rg:hover{transform:translateY(-3px)}
.rg b{font-family:var(--f-display);font-size:14px}
.rg span{font-family:var(--f-en);font-size:18px;line-height:1.15}
.talk{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
.scenes{display:flex;flex-direction:column;gap:6px;position:sticky;top:84px}
.scenes button{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 14px;border-radius:14px;border:1px solid transparent;background:none;transition:background .15s,transform .18s cubic-bezier(.3,1.6,.5,1)}
.scenes button:hover{background:var(--surface);transform:translateX(3px)}
.scenes button.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.scenes .n{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--r);color:#fff;font-family:var(--f-display);font-weight:800;flex:none}
.scenes button.done .n{background:var(--ok)}
.scenes strong{display:block;font-size:14px;line-height:1.2}
.scenes small{color:var(--muted);font-size:12px}
.phone{max-width:560px;width:100%;margin:0 auto;border-radius:36px;border:8px solid var(--ink);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:560px}
.ph-top{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(135deg,var(--c-s),var(--c-t) 60%,var(--c-x));color:#fff}
.ph-top b{font-family:var(--f-display);display:block}
.ph-top small{opacity:.85;font-size:12px}
.msgs{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:400px;max-height:62vh;overflow-y:auto;background:var(--surface2)}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:90%;animation:msgIn .4s cubic-bezier(.3,1.5,.5,1) both}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;color:#fff;flex:none;background:var(--ac)}
.bub{padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--surface);border:1px solid var(--line);font-size:17px;line-height:1.35;cursor:pointer;text-align:left;transition:transform .15s}
.bub:hover{transform:scale(1.015)}
.msg.me .bub{border-radius:18px 18px 6px 18px;background:linear-gradient(135deg,var(--c-s),var(--c-t));color:#fff;border:0}
.bub .ru{display:block;font-size:13px;opacity:.78;margin-top:4px}
.msgs.notr .bub .ru{display:none}
.term{border:0;background:color-mix(in srgb,var(--c-p) 30%,transparent);color:inherit;padding:0 4px;border-radius:5px;font:inherit;font-weight:700;border-bottom:2px solid var(--c-p);cursor:pointer}
.msg.me .term{background:rgba(255,255,255,.22);border-bottom-color:#fff}
.typing{display:flex;gap:4px;padding:13px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);width:fit-content}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-5px);opacity:.4}}
@keyframes msgIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
.ph-bar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);flex-wrap:wrap}

/* chat trainer */
.cmodes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ph-top .streak{margin-left:auto;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.ph-top .streak svg{width:16px;height:16px}
.cpanel{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.ctask p{font-size:19px;font-weight:600;line-height:1.3}
.cpanel .slot{min-height:56px;padding:10px}
.cpanel .pool{min-height:44px}
.opts{display:grid;gap:8px}
.opts .qopt{padding:12px 14px;text-align:left;font-size:17px}
.opts .qopt .en{font-size:20px}
.cwrap{max-width:620px;margin:0 auto}
.chatbest{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-align:center;margin-top:10px}

.lang{display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;background:var(--ink);color:var(--surface);font-weight:800;font-size:13px;text-decoration:none;white-space:nowrap;flex:none;transition:transform .18s cubic-bezier(.3,1.8,.5,1)}
.lang:hover{transform:translateY(-2px)}
@media (max-width:720px){
  .top{position:static}
  .modes,.games{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}
  .mode{padding:12px;gap:6px}
  .mode .mi{width:32px;height:32px;border-radius:9px}
  .mode .mi svg{width:18px;height:18px}
  .mode b{font-size:14px;line-height:1.15}
  .mode span:last-child{font-size:11.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .lesson,.cwrap,#tdetail,#ask{scroll-margin-top:12px}
}
.top-in{gap:8px}
@media (max-width:520px){.brand{font-size:15px}.stats .stat:nth-child(3){display:none}.lang{padding:6px 10px}}
/* tiers, songs, pagination */
.tier{position:absolute;right:14px;top:18px;display:flex;gap:2px;align-items:flex-end}
.tier i{display:block;width:4px;border-radius:2px;background:var(--line)}
.tier i:nth-child(1){height:6px}.tier i:nth-child(2){height:9px}.tier i:nth-child(3){height:12px}
.tier.t1 i:nth-child(1),.tier.t2 i:nth-child(-n+2),.tier.t3 i{background:var(--r)}
.w .nt{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--surface2);color:var(--c-t);vertical-align:3px;margin-left:6px}
.w .nt svg{width:12px;height:12px}
.song{display:inline-flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--c-t) 14%,var(--surface)),var(--surface2));border:1px solid var(--line);font-size:13px;line-height:1.3;max-width:100%}
.song svg{width:18px;height:18px;color:var(--c-t);flex:none}
.song b{font-weight:700}
.song small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wcount{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 0 10px;letter-spacing:.04em}
.lvl{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--ink);color:var(--surface);font-weight:800;font-size:13px;white-space:nowrap}
.lvl svg{width:26px;height:26px}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:18px 22px;margin-bottom:14px}
.goal svg{width:76px;height:76px}
.goal b{font-family:var(--f-display);font-size:22px}
.gbanner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:22px 24px;margin-bottom:28px;text-decoration:none;color:var(--ink);position:relative;overflow:hidden}
.gbanner h3{font-size:24px}
.gbanner p{color:var(--muted)}
.gbanner .stack{display:flex;gap:6px}
.gbanner .stack .blk{transform:rotate(var(--rot));font-size:15px}

/* GAMES */
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.garena{padding:24px;min-height:440px;display:flex;flex-direction:column;gap:18px}
.gintro{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;flex:1}
.gintro .best{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ring{position:relative;width:64px;height:64px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
.score{display:flex;flex-direction:column;align-items:center}
.score b{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:12px;color:var(--muted)}
.combo{font-family:var(--f-display);font-weight:900;font-size:26px;padding:6px 14px;border-radius:12px;background:var(--c-v);color:#fff;min-width:64px;text-align:center;transition:transform .2s}
.combo.up{animation:bump .35s cubic-bezier(.3,1.7,.5,1)}
.gword{font-family:var(--f-en);font-size:clamp(40px,7vw,64px);line-height:1;text-align:center;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.gword.pop{animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
.pairs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pc{perspective:800px;border:0;background:none;padding:0;display:block;width:100%;aspect-ratio:4/3;max-width:100%;min-height:72px}
.pc-in{display:block;position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.pc.on .pc-in,.pc.ok .pc-in{transform:rotateY(180deg)}
.pc-f,.pc-b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center}
.pc-f{background:var(--c-s);background-image:radial-gradient(rgba(255,255,255,.28) 3px,transparent 3.5px);background-size:18px 18px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.pc-b{transform:rotateY(180deg);background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.pc-b.en{font-family:var(--f-en);font-weight:400;font-size:20px}
.pc.ok .pc-b{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.pc.ok{animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
.trk{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;padding:26px 18px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--c-t) 18%,var(--surface2)),color-mix(in srgb,var(--c-x) 10%,var(--surface2)));border:1px solid var(--line)}
.trk .tt{font-family:var(--f-display);font-weight:900;font-size:clamp(24px,4vw,36px);line-height:1.1}
.trk .ar{color:var(--muted);font-weight:600}
.trk .disc{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 7px,var(--ink) 8px 12px,#2a2f45 13px 100%);box-shadow:0 6px 18px rgba(0,0,0,.25);animation:spinSlow 3s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}

/* FX */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);z-index:60;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .35s cubic-bezier(.3,1.5,.5,1);max-width:calc(100vw - 32px)}
#toast.on{transform:translateX(-50%) translateY(0)}

function exCard(li, ti, t) {

  </section>`;
}
function exTask(id) { const [li, ti] = id.split('-').map(Number); return LESSONS[li].tasks[ti]; }
function paintEx(id, popIdx) {
  const card = $(`[data-ex="${id}"]`); if (!card) return;
  const t = exTask(id), st = exState[id];
  const chip = (i, where) => `<button type="button" class="blk r-${t.p[i][1]} ${i === popIdx ? 'pop' : ''}" data-chip="${i}" data-where="${where}">${esc(t.p[i][0])}</button>`;

    else { st.slot = st.slot.filter(x => x !== i); st.pool.push(i); }

    const got = st.slot.map(i => t.p[i][0]).join(' '), want = t.p.map(p => p[0]).join(' ');

      renderLessons(+id.split('-')[0]);

      const wrong = st.slot.findIndex((i, k) => t.p[i][0] !== t.p[k][0]);

    }
  }
}

      <li>Раздел «Сленг и разговорка» собирает слова из живых чатов и соцсетей, а «Маты 18+» закрыт по умолчанию и нужен для понимания. У каждого слова указана жёсткость, а оскорбления по расе, национальности и ориентации я не включал.</li>
      <li>Музыкальные плашки показывают только <b>названия</b> известных треков, где встречается слово. Тексты песен защищены авторским правом, поэтому их здесь нет. Найди трек и послушай, как слово звучит в жизни.</li>
    </ol>
    <div class="tip">${I.bulb}<p>Простой режим: 10 карточек в день в режиме «Русский → English» + один урок или одно время. Через месяц это ~300 повторений и заметно более свободная речь.</p></div>
  </section>`;
}
